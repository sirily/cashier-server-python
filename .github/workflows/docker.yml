name: Release candidate

on:
  push:
    branches:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan RC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.8'
          python-version: '3.13'
          enable-cache: false

      - name: Install Python
        run: uv python install

      - name: Plan RC and validate release-branch versions
        id: plan
        run: node scripts/release.mjs plan-rc

  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: Publish RC image
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Separate pushes must not replace one another's pending builds.
    concurrency:
      group: rc-${{ github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_IMAGE: ${{ needs.plan.outputs.image }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing RC image
        id: image
        run: node scripts/release.mjs image-status

      - name: Set up QEMU
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push RC image
        if: steps.image.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.tag }}
          annotations: |
            index:org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            index:org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest newly built RC image
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.RELEASE_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published or reused RC image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.image.outputs.digest }}
        run: |
          GITHUB_OUTPUT="$RUNNER_TEMP/rc-image-status" node scripts/release.mjs image-status
          grep -Fx 'exists=true' "$RUNNER_TEMP/rc-image-status"
          test -n "$IMAGE_DIGEST"
          grep -Fx "digest=$IMAGE_DIGEST" "$RUNNER_TEMP/rc-image-status"
