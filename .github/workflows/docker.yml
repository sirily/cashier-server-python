name: Docker

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835654f32e52b6aa8f52c55b3 # v5

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build single-platform image for acceptance test
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'fix-production-plugin-runtime' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cashier-server-acceptance:test
          cache-from: type=gha

      - name: Install acceptance test Node dependencies
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'fix-production-plugin-runtime' }}
        run: npm ci
        working-directory: tests/acceptance

      - name: Run container acceptance tests
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'fix-production-plugin-runtime' }}
        run: |
          uv run pytest tests/test_container_acceptance.py -v --timeout=180
        env:
          DOCKER_ACCEPTANCE: "true"
          CASHIER_ACCEPTANCE_SKIP_BUILD: "true"
